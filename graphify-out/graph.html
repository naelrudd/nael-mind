<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠 Nael Mind Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      overflow: hidden;
    }
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 20px;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #30363d;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header .stats {
      font-size: 13px;
      color: #8b949e;
    }
    .controls {
      position: fixed;
      top: 60px; left: 20px;
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      z-index: 100;
      max-width: 280px;
    }
    .controls h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #58a6ff;
    }
    .control-group {
      margin-bottom: 12px;
    }
    .control-group label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 4px;
    }
    .control-group input[type="range"] {
      width: 100%;
    }
    .control-group input[type="text"] {
      width: 100%;
      padding: 6px 10px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 13px;
    }
    .legend {
      margin-top: 16px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .legend-color {
      width: 12px; height: 12px;
      border-radius: 50%;
    }
    #graph {
      width: 100vw;
      height: 100vh;
    }
    .node circle {
      cursor: pointer;
      transition: all 0.3s;
    }
    .node:hover circle {
      stroke: #fff;
      stroke-width: 3px;
    }
    .node text {
      font-size: 11px;
      fill: #c9d1d9;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .link {
      stroke: #30363d;
      stroke-opacity: 0.6;
      transition: all 0.3s;
    }
    .tooltip {
      position: absolute;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 300px;
      z-index: 200;
    }
    .tooltip.show { opacity: 1; }
    .tooltip h4 {
      color: #58a6ff;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .tooltip p {
      color: #8b949e;
      font-size: 12px;
      line-height: 1.4;
    }
    .community-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .community-btn {
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
      font-size: 11px;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.2s;
    }
    .community-btn:hover, .community-btn.active {
      opacity: 1;
      transform: scale(1.05);
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="header">
    <h1>🧠 Nael Mind Graph</h1>
    <div class="stats" id="stats">Loading...</div>
  </div>

  <div class="controls">
    <h3>🔍 Controls</h3>
    <div class="control-group">
      <label>Search Node</label>
      <input type="text" id="search" placeholder="Type to search...">
    </div>
    <div class="control-group">
      <label>Node Size</label>
      <input type="range" id="nodeSize" min="3" max="20" value="8">
    </div>
    <div class="control-group">
      <label>Link Distance</label>
      <input type="range" id="linkDist" min="50" max="300" value="100">
    </div>
    <div class="legend">
      <label>Communities</label>
      <div class="community-filter" id="communityFilter"></div>
    </div>
  </div>

  <div id="graph"></div>
  <div class="tooltip" id="tooltip"></div>

  <script>
    // Color palette for communities
    const colors = [
      '#58a6ff', '#f85149', '#238636', '#d29922', '#a371f7',
      '#3fb950', '#f0883e', '#79c0ff', '#ff7b72', '#56d364'
    ];

    let graphData = { nodes: [], links: [] };
    let simulation;
    let svg;
    let activeCommunities = new Set();

    // Load graph.json
    async function loadGraph() {
      try {
        const response = await fetch('/api/graph', { cache: 'no-store' });
        const data = await response.json();

        // Parse Graphify format
        graphData = parseGraphify(data);

        document.getElementById('stats').textContent = 
          `${graphData.nodes.length} nodes · ${graphData.links.length} edges · ${new Set(graphData.nodes.map(n => n.community)).size} communities`;

        setupCommunityFilter();
        renderGraph();
      } catch (err) {
        document.getElementById('stats').textContent = 'Error loading graph.json';
        console.error(err);
      }
    }

    function parseGraphify(data) {
      // Graphify format: nodes and edges arrays
      const nodes = (data.nodes || []).map((n, i) => ({
        id: n.id || i,
        name: n.label || n.id || `Node ${i}`,
        community: n.community !== undefined ? n.community : 0,
        type: n.type || 'concept',
        importance: n.importance || n.centrality || 1,
        description: n.description || '',
      }));

      const links = (data.edges || data.links || []).map((e, i) => ({
        source: e.source,
        target: e.target,
        weight: e.weight || 1,
        type: e.type || 'related',
      }));

      return { nodes, links };
    }

    function setupCommunityFilter() {
      const communities = [...new Set(graphData.nodes.map(n => n.community))].sort((a, b) => a - b);
      const container = document.getElementById('communityFilter');

      communities.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'community-btn active';
        btn.style.background = colors[c % colors.length];
        btn.style.color = '#fff';
        btn.textContent = `C${c}`;
        btn.dataset.community = c;
        btn.onclick = () => toggleCommunity(c, btn);
        container.appendChild(btn);
        activeCommunities.add(c);
      });
    }

    function toggleCommunity(community, btn) {
      if (activeCommunities.has(community)) {
        activeCommunities.delete(community);
        btn.classList.remove('active');
        btn.style.opacity = '0.3';
      } else {
        activeCommunities.add(community);
        btn.classList.add('active');
        btn.style.opacity = '0.7';
      }
      updateVisibility();
    }

    function updateVisibility() {
      svg.selectAll('.node')
        .style('opacity', d => activeCommunities.has(d.community) ? 1 : 0.1);

      svg.selectAll('.link')
        .style('opacity', d => {
          const sourceNode = graphData.nodes.find(n => n.id === d.source.id || n.id === d.source);
          const targetNode = graphData.nodes.find(n => n.id === d.target.id || n.id === d.target);
          return (activeCommunities.has(sourceNode?.community) && activeCommunities.has(targetNode?.community)) ? 0.6 : 0.05;
        });
    }

    function renderGraph() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const nodeSize = +document.getElementById('nodeSize').value;
      const linkDist = +document.getElementById('linkDist').value;

      d3.select('#graph').selectAll('*').remove();

      svg = d3.select('#graph')
        .append('svg')
        .attr('width', width)
        .attr('height', height)
        .call(d3.zoom()
          .scaleExtent([0.1, 4])
          .on('zoom', (event) => {
            g.attr('transform', event.transform);
          }));

      const g = svg.append('g');

      simulation = d3.forceSimulation(graphData.nodes)
        .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(linkDist))
        .force('charge', d3.forceManyBody().strength(-300))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(nodeSize * 2));

      // Links
      const link = g.append('g')
        .selectAll('line')
        .data(graphData.links)
        .enter()
        .append('line')
        .attr('class', 'link')
        .attr('stroke-width', d => Math.sqrt(d.weight || 1));

      // Nodes
      const node = g.append('g')
        .selectAll('.node')
        .data(graphData.nodes)
        .enter()
        .append('g')
        .attr('class', 'node')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));

      node.append('circle')
        .attr('r', d => nodeSize * (0.5 + d.importance * 0.5))
        .attr('fill', d => colors[d.community % colors.length])
        .attr('stroke', '#0d1117')
        .attr('stroke-width', 2);

      // Labels for important nodes
      node.append('text')
        .attr('dx', nodeSize + 4)
        .attr('dy', 4)
        .text(d => d.name.length > 20 ? d.name.substring(0, 20) + '...' : d.name)
        .style('opacity', d => d.importance > 0.7 ? 1 : 0.7);

      // Tooltip
      const tooltip = document.getElementById('tooltip');

      node.on('mouseover', (event, d) => {
        tooltip.innerHTML = `
          <h4>${d.name}</h4>
          <p>Type: ${d.type}</p>
          <p>Community: ${d.community}</p>
          <p>Importance: ${(d.importance * 100).toFixed(1)}%</p>
          ${d.description ? `<p>${d.description}</p>` : ''}
        `;
        tooltip.style.left = (event.pageX + 10) + 'px';
        tooltip.style.top = (event.pageY + 10) + 'px';
        tooltip.classList.add('show');
      })
      .on('mouseout', () => {
        tooltip.classList.remove('show');
      })
      .on('click', (event, d) => {
        // Highlight connected nodes
        const connected = new Set();
        graphData.links.forEach(l => {
          if (l.source.id === d.id || l.source === d.id) connected.add(l.target.id || l.target);
          if (l.target.id === d.id || l.target === d.id) connected.add(l.source.id || l.source);
        });

        node.style('opacity', n => (n.id === d.id || connected.has(n.id)) ? 1 : 0.2);
        link.style('opacity', l => (l.source.id === d.id || l.target.id === d.id || l.source === d.id || l.target === d.id) ? 1 : 0.1);
      });

      // Double click to reset
      svg.on('dblclick', () => {
        updateVisibility();
      });

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        node
          .attr('transform', d => `translate(${d.x},${d.y})`);
      });

      // Search
      document.getElementById('search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        if (!query) {
          updateVisibility();
          return;
        }

        node.style('opacity', d => d.name.toLowerCase().includes(query) ? 1 : 0.1);
        link.style('opacity', 0.05);
      });

      // Controls
      document.getElementById('nodeSize').addEventListener('input', () => renderGraph());
      document.getElementById('linkDist').addEventListener('input', () => {
        simulation.force('link').distance(+document.getElementById('linkDist').value);
        simulation.alpha(1).restart();
      });
    }

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    // Handle resize
    window.addEventListener('resize', () => {
      renderGraph();
    });

    loadGraph();
  </script>
</body>
</html>
